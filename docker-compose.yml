services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: netrodb
      POSTGRES_USER: netro_user
      POSTGRES_PASSWORD: netropass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"


volumes:
  postgres_data:

